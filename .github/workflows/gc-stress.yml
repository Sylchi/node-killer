name: gc-stress

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!README.md'
      - '!docs/**'
      - '!examples/**'
      - '.github/workflows/gc-stress.yml'
  push:
    branches:
      - master
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!README.md'
      - '!docs/**'
      - '!examples/**'
      - '.github/workflows/gc-stress.yml'

jobs:
  gc-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-DFORCE_GC_AT_MALLOC -fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build -j"$(nproc)" --target run-test262
      - name: test
        run: |
          ./build/run-test262 -c tests.conf -x gc-stress-skip.txt
