name: ci

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!README.md'
      - '!docs/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - master
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!README.md'
      - '!docs/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'

jobs:
  qnode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        # `act` binds the working tree into the container, so checkout is a
        # no-op that still costs a step startup. GitHub still needs it.
        if: ${{ !env.ACT }}
      - name: build
        # The JavaScript C compiler needs Node.js only.
        run: node scripts/build.js
      - name: test
        run: node scripts/build.js qnode-test
