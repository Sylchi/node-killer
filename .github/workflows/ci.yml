name: ci

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!README.md'
      - '!docs/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - master
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!README.md'
      - '!docs/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: |
          make codegen
      - name: Check if the git repository is clean
        run: (exit "$(git status --porcelain --untracked-files=no | head -255 | wc -l)") || (echo "Dirty git tree"; git diff; exit 1)

  ci:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.configType }}${{ matrix.config.arch }})
    defaults:
      run:
        shell: ${{ matrix.config.arch == '' && 'sh' || 'alpine.sh' }} {0}

    strategy:
      fail-fast: false
      matrix:
        config:
          # see https://github.com/quickjs-ng/quickjs/issues/879 - tl;dr flaky
          #- { os: ubuntu-24.04-arm, configType: Debug }
          #- { os: ubuntu-24.04-arm, configType: Release, runTest262: true }
          - { os: ubuntu-latest, configType: Debug }
          - { os: ubuntu-latest, configType: Release, runTest262: true }
          - { os: ubuntu-latest, arch: x86, runTest262: true }
          - { os: ubuntu-latest, arch: riscv64 }

          - { os: macos-15, configType: Debug }
          - { os: macos-15, configType: Release }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install extra dependencies
        if: ${{ matrix.config.arch != '' }}
        shell: 'sh'
        run: |
          sudo apt update && sudo apt install -y binfmt-support

      - name: Setup Alpine
        if: ${{ matrix.config.arch != '' }}
        uses: quickjs-ng/setup-alpine@master
        with:
          arch: ${{ matrix.config.arch }}
          packages: "build-base make cmake git"
          apk-tools-url: https://raw.githubusercontent.com/quickjs-ng/apk-for-ci/refs/heads/master/apk.static#!sha256!34bb1a96f0258982377a289392d4ea9f3f4b767a4bb5806b1b87179b79ad8a1c

      - name: uname
        run: uname -a

      - name: Set build ENV vars
        run: |
          if [ "${{ matrix.config.configType }}" = "Debug" ]; then
            echo "BUILD_TYPE=Debug" >> $GITHUB_ENV;
          fi

      - name: build
        run: |
          make BUILD_TYPE=$BUILD_TYPE

      - name: stats
        run: |
          make stats

      - name: cxxtest
        run: |
          make cxxtest

      - name: test
        run: |
          make test

      - name: test 262
        if: ${{ matrix.config.runTest262 }}
        run: |
          git submodule update --init --checkout --depth 1
          make test262

      - name: test standalone
        run: |
          ./build/qjs -c examples/hello.js -o hello
          ./hello

      - name: test api
        run: |
          ./build/api-test

      - name: test lre
        run: |
          ./build/lre-test

  qnode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build --target qnode_exe -j "$(getconf _NPROCESSORS_ONLN)"
      - name: test
        run: make qnode-test

  windows-msvc:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: x64, vsArch: x64, buildType: Debug, os: windows-latest, msvc: 18 }
          - { arch: x64, vsArch: x64, buildType: Release, os: windows-latest, msvc: 18 }
          - { arch: Win32, vsArch: x86, buildType: Debug, os: windows-latest, msvc: 18 }
          - { arch: Win32, vsArch: x86, buildType: Release, os: windows-latest, msvc: 18 }
          - { arch: ARM64, vsArch: arm64, buildType: Debug, os: windows-11-arm, msvc: 18 }
          - { arch: ARM64, vsArch: arm64, buildType: Release, os: windows-11-arm, msvc: 18 }
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: |
          cmake -B build -G "Visual Studio ${{matrix.config.msvc}}" -A ${{matrix.config.arch}}
          cmake --build build --config ${{matrix.config.buildType}}
      - name: stats
        run: |
          build\${{matrix.config.buildType}}\qjs.exe -qd
      - name: test
        run: |
          build\${{matrix.config.buildType}}\run-test262.exe -c tests.conf
          build\${{matrix.config.buildType}}\function_source.exe
      - name: test standalone
        run: |
          build\${{matrix.config.buildType}}\qjs.exe -c examples\hello.js -o hello.exe
          .\hello.exe
      - name: test api
        run: |
          build\${{matrix.config.buildType}}\api-test.exe
      - name: test lre
        run: |
          build\${{matrix.config.buildType}}\lre-test.exe
      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: ${{ matrix.config.vsArch }}
      - name: cxxtest
        run: |
          cl.exe /DJS_NAN_BOXING=0 /Zs cxxtest.cc
          cl.exe /DJS_NAN_BOXING=1 /Zs cxxtest.cc

  windows-clang:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        buildType: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: install ninja
        run: |
          choco install ninja
          ninja.exe --version
      - name: build
        run: |
          git submodule update --init --checkout --depth 1
          cmake -B build -DCMAKE_BUILD_TYPE=${{matrix.buildType}} -DCMAKE_C_COMPILER=clang.exe -G "Ninja"
          cmake --build build --config ${{matrix.buildType}}
      - name: stats
        run: |
          build\qjs.exe -qd
      - name: cxxtest
        run: |
          clang.exe -D JS_NAN_BOXING=0 -fsyntax-only cxxtest.cc
          clang.exe -D JS_NAN_BOXING=1 -fsyntax-only cxxtest.cc
      - name: test
        run: |
          build\run-test262.exe -c tests.conf
          build\function_source.exe

  windows-clang-cl:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        buildType: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: |
          git submodule update --init --checkout --depth 1
          cmake -B build -G "Visual Studio 18" -T ClangCL
          cmake --build build --config ${{matrix.buildType}}
      - name: stats
        run: |
          build\${{matrix.buildType}}\qjs.exe -qd
      - name: cxxtest
        run: |
          clang-cl.exe /DJS_NAN_BOXING=0 /Zs cxxtest.cc
          clang-cl.exe /DJS_NAN_BOXING=1 /Zs cxxtest.cc
      - name: test
        run: |
          cp build\${{matrix.buildType}}\fib.dll examples\
          cp build\${{matrix.buildType}}\point.dll examples\
          build\${{matrix.buildType}}\qjs.exe examples\test_fib.js
          build\${{matrix.buildType}}\qjs.exe examples\test_point.js
          build\${{matrix.buildType}}\run-test262.exe -c tests.conf
          build\${{matrix.buildType}}\function_source.exe
      - name: test api
        run: |
          build\${{matrix.buildType}}\api-test.exe
      - name: test lre
        run: |
          build\${{matrix.buildType}}\lre-test.exe

  windows-ninja:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        buildType: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: install ninja
        run: |
          choco install ninja
          ninja.exe --version
      - name: build
        run: |
          git submodule update --init --checkout --depth 1
          cmake -B build -DCMAKE_BUILD_TYPE=${{matrix.buildType}} -G "Ninja"
          cmake --build build
      - name: stats
        run: |
          build\qjs.exe -qd
      - name: test
        run: |
          build\run-test262.exe -c tests.conf
          build\function_source.exe
      - name: test api
        run: |
          build\api-test.exe
      - name: test lre
        run: |
          build\lre-test.exe

  windows-sdk:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
        buildType: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: Install windows sdk
        uses: ChristopheLav/windows-sdk-install@v1
        with:
          version-sdk: 26100
          features: 'OptionId.DesktopCPPx86,OptionId.DesktopCPPx64'
      - name: build
        run: |
          cmake -B build -DCMAKE_SYSTEM_VERSION="10.0.26100.0" -A ${{matrix.arch}}
          cmake --build build --config ${{matrix.buildType}}
      - name: stats
        run: |
          build\${{matrix.buildType}}\qjs.exe -qd
      - name: test
        run: |
          cp build\${{matrix.buildType}}\fib.dll examples\
          cp build\${{matrix.buildType}}\point.dll examples\
          build\${{matrix.buildType}}\qjs.exe examples\test_fib.js
          build\${{matrix.buildType}}\qjs.exe examples\test_point.js
          build\${{matrix.buildType}}\run-test262.exe -c tests.conf
          build\${{matrix.buildType}}\function_source.exe
      - name: test api
        run: |
          build\${{matrix.buildType}}\api-test.exe
      - name: test lre
        run: |
          build\${{matrix.buildType}}\lre-test.exe

  windows-mingw:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        buildType: [Debug, Release]
        sys:
          - mingw32
          - mingw64
          - clang64
          - ucrt64
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v7
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        msystem: ${{matrix.sys}}
        install: >-
          git
          make
        pacboy: >-
          cmake:p
          ninja:p
          toolchain:p
    - name: build
      run: |
        make BUILD_TYPE=${{matrix.buildType}}
    - name: stats
      run: |
        make stats
        ldd build/qjs
    - name: cxxtest
      if: ${{ matrix.sys != 'clang64' }}
      run: |
        make cxxtest
    - name: cxxtest
      if: ${{ matrix.sys == 'clang64' }}
      run: |
        make cxxtest CXX=clang++
    - name: test
      run: |
        make test
    - name: test standalone
      run: |
        ./build/qjs -c examples/hello.js -o hello.exe
        ./hello
    - name: test api
      run: |
        ./build/api-test
    - name: test lre
      run: |
        ./build/lre-test
  emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
      - name: check emsdk
        run: emcc -v
      - name: build
        run: |
          emcmake cmake -B build
          emmake make -C build qjs_wasm "-j$(getconf _NPROCESSORS_ONLN)"
      - name: result
        run: ls -lh build
  wasi:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: jcbhmr/setup-wasmtime@v2
      - name: setup wasi-sdk
        run: |
          wget -nv https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.deb -P /tmp
          sudo apt install /tmp/wasi-sdk*.deb
      - name: test
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=/opt/wasi-sdk/share/cmake/wasi-sdk.cmake
          make -C build qjs_exe
          wasmtime run build/qjs -qd
          echo "console.log('hello wasi!');" > t.js
          wasmtime run --dir . build/qjs t.js
          wasmtime run --dir . build/qjs --stack-size 64K tests/wasi-stack-limit.js
          wasmtime run --dir . build/qjs tests/wasi-stack-limit.js
      - name: build wasi reactor
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=/opt/wasi-sdk/share/cmake/wasi-sdk.cmake -DQJS_WASI_REACTOR=ON
          make -C build qjs_wasi
          ls -lh build/qjs.wasm
      - name: check wasi reactor exports
        run: |
          exports=$(/opt/wasi-sdk/bin/llvm-nm --extern-only --defined-only --just-symbol-name build/qjs.wasm)
          expected=(
            # Reactor entry points
            qjs_init qjs_init_argv qjs_get_context qjs_destroy
            # libc allocator
            malloc free realloc calloc
            # Some of core JS_EXTERN API
            JS_NewRuntime JS_FreeRuntime JS_NewContext JS_FreeContext
            JS_Eval JS_FreeValue JS_GetException JS_ToCStringLen2
            # Some of quickjs-libc JS_LIBC_EXTERN API
            js_std_add_helpers js_std_init_handlers
          )
          missing=0
          for sym in "${expected[@]}"; do
            echo "$exports" | grep -qx "$sym" || { echo "missing export: $sym"; missing=1; }
          done
          exit $missing
      - name: check wasi reactor table is exported and growable
        shell: node {0}
        run: |
          const m = new WebAssembly.Module(require('fs').readFileSync('build/qjs.wasm'));
          const imports = {};
          for (const i of WebAssembly.Module.imports(m)) (imports[i.module] ??= {})[i.name] = () => {};
          new WebAssembly.Instance(m, imports).exports.__indirect_function_table.grow(1);

  cygwin:
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
    env:
      CYGWIN_NOWINPATH: 1
      CHERE_INVOKING: 1
    steps:
      - name: Set up Cygwin
        uses: cygwin/cygwin-install-action@master
        with:
            packages: make cmake gcc-g++ bash

      - uses: actions/checkout@v7

      - name: build
        run: make

      - name: stats
        run: make stats

      - name: cxxtest
        run: |
          make cxxtest

      - name: test
        run: make test

      - name: test api
        run: |
          ./build/api-test

      - name: test lre
        run: |
          ./build/lre-test

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build + test
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add cmake gmake
          run: |
            gmake
            gmake stats

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build + test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake gmake
          run: |
            gmake
            gmake stats

  android:
    runs-on: ubuntu-latest
    container: reactnativecommunity/react-native-android:v13.0
    steps:
      - uses: actions/checkout@v7
      - name: Configure android arm64
        # see build options you can use in https://developer.android.com/ndk/guides/cmake
        run: |
          mkdir build
          cd build
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" "-DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.0.10792818/build/cmake/android.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release -DANDROID_ABI="arm64-v8a" -DANDROID_PLATFORM=android-24 ..
      - name: Build android arm64
        run: |
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build build --target qjs
          ls -lh build

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: configure
        run: |
          cmake -B build -GXcode -DCMAKE_SYSTEM_NAME:STRING=iOS -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED:BOOL=NO
      - name: build
        run: |
          cmake --build build --config Release --target qjs
          ls -lh build

  amalgam:
    strategy:
      matrix:
        # TODO(bnoordhuis) test on windows
        config:
          - { os: ubuntu-latest }
          - { os: macos-latest }
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: |
          make
      - name: create amalgamation
        run: |
          make amalgam
      - name: build amalgamation
        run: |
          unzip -d "$RUNNER_TEMP" build/quickjs-amalgam.zip
          cc -Wall -I. -o "$RUNNER_TEMP/run-test262.o" -c run-test262.c
          cc -Wall -I/ -DQJS_BUILD_LIBC -o "$RUNNER_TEMP/quickjs-amalgam.o" -c "$RUNNER_TEMP/quickjs-amalgam.c"
          cc -o "$RUNNER_TEMP/run-test262" "$RUNNER_TEMP/run-test262.o" "$RUNNER_TEMP/quickjs-amalgam.o" -lm
      - name: test
        run: |
          make test RUN262="$RUNNER_TEMP/run-test262"

  jscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: jscheck
        run: |
          make jscheck
